<svg xmlns="http://www.w3.org/2000/svg" width="800" height="476" viewBox="0 0 800 476" role="img" aria-label="Featured projects: Mantel VPN, RAM-only nodes, post-quantum tunnel, port forwarding, Telegram bot">
<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111917"/><stop offset="1" stop-color="#0b0f0e"/></linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="799" height="147" rx="14" fill="url(#cg)" stroke="#1e2a26"/><rect x="20" y="0.5" width="44" height="2" rx="1" fill="#2fbf8a"/><text x="20" y="28" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#7d8590">MANTELVPN.COM</text><text x="20" y="54" font-size="19" font-weight="700" fill="#e6edf3">Mantel VPN</text><text x="20" y="80" font-size="13.5" fill="#a7b0ba">Private VPN. Your account is a number, not an email address.</text><text x="20" y="99" font-size="13.5" fill="#a7b0ba">Pay with Monero, Bitcoin or Litecoin.</text><rect x="20" y="108" width="67" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="53.4" y="123" text-anchor="middle" font-size="11.5" fill="#2fbf8a">no email</text><rect x="94.8" y="108" width="113" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="151.3" y="123" text-anchor="middle" font-size="11.5" fill="#2fbf8a">crypto payments</text><rect x="215.8" y="108" width="73" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="252.5" y="123" text-anchor="middle" font-size="11.5" fill="#2fbf8a">WireGuard</text></g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="164.5" width="391" height="147" rx="14" fill="url(#cg)" stroke="#1e2a26"/><rect x="20" y="164.5" width="44" height="2" rx="1" fill="#2fbf8a"/><text x="20" y="192" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#7d8590">INFRASTRUCTURE</text><text x="20" y="218" font-size="19" font-weight="700" fill="#e6edf3">RAM-only nodes</text><text x="20" y="244" font-size="13.5" fill="#a7b0ba">Signed OS image via stboot, nothing on disk.</text><text x="20" y="263" font-size="13.5" fill="#a7b0ba">Image hashes are public.</text><rect x="20" y="272" width="54" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="46.8" y="287" text-anchor="middle" font-size="11.5" fill="#2fbf8a">stboot</text><rect x="81.6" y="272" width="93" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="128.2" y="287" text-anchor="middle" font-size="11.5" fill="#2fbf8a">signed image</text><rect x="182.79999999999998" y="272" width="100" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="232.7" y="287" text-anchor="middle" font-size="11.5" fill="#2fbf8a">public hashes</text></g>
