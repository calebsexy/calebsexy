<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="328.5" width="391" height="147" rx="14" fill="url(#cg)" stroke="#1e2a26"/><rect x="20" y="328.5" width="44" height="2" rx="1" fill="#2fbf8a"/><text x="20" y="356" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#7d8590">NETWORK</text><text x="20" y="382" font-size="19" font-weight="700" fill="#e6edf3">Port forwarding</text><text x="20" y="408" font-size="13.5" fill="#a7b0ba">TCP and UDP per device, for games,</text><text x="20" y="427" font-size="13.5" fill="#a7b0ba">self-hosting and torrents.</text><rect x="20" y="436" width="34" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="36.9" y="451" text-anchor="middle" font-size="11.5" fill="#2fbf8a">TCP</text><rect x="61.8" y="436" width="34" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="78.7" y="451" text-anchor="middle" font-size="11.5" fill="#2fbf8a">UDP</text><rect x="103.6" y="436" width="80" height="22" rx="11" fill="#2fbf8a" fill-opacity="0.08" stroke="#2fbf8a" stroke-opacity="0.35"/><text x="143.6" y="451" text-anchor="middle" font-size="11.5" fill="#2fbf8a">per device</text></g>
